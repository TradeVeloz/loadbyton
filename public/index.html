<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0B0E14"/>
<title>Loadbyton — Container haulage, on demand</title>
<meta name="description" content="Post a container. Vetted carriers bid. Award, share papers, track to the warehouse — all in one place."/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230B0E14'/%3E%3Crect x='4' y='9' width='11' height='8' rx='1.5' fill='%23E85D0C'/%3E%3Cpath d='M17 11l3 2-3 2' stroke='%23E85D0C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>

<div id="landing" class="landing"><div id="landing-root"></div></div>

<div id="app" class="app hidden">
  <div class="appbar">
    <div class="brand"><span class="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="9" width="11" height="8" rx="1.5" fill="#E85D0C"/><path d="M17 11l3 2-3 2" stroke="#E85D0C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Loadbyton</div>
    <div class="spacer"></div>
    <button class="iconbtn badge" aria-label="Notifications" onclick="LB.shared.toast('You have new activity')"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 21a2 2 0 004 0" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="who-btn" onclick="LB.logout()" aria-label="Switch role"><span class="who"><span id="rp-name">—</span><small id="rp-role">—</small></span><span class="av" id="rp-av">?</span></button>
  </div>
  <div class="layout">
    <aside class="rail"><nav id="rail"></nav></aside>
    <main class="main" id="view"></main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="awardbar" id="awardbar"><div class="in"><div class="info"><b id="awb-title">Select a carrier</b><small id="awb-sub">Tap a bid to choose it</small></div><button class="btn btn-ink" id="awb-btn" disabled>Award</button></div></div>

<div class="ov" id="ov"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
